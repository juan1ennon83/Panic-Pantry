<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201b2c">
  <title>Panic Pantry — diner dash mayhem</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #211a2d;
      --cream: #fff2d8;
      --muted: #b9aec6;
      --pink: #ff6e79;
      --orange: #ffb447;
      --mint: #67d9b0;
      --panel: rgba(255,255,255,.075);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--cream);
      background: radial-gradient(ellipse at 50% -18%, #59405a 0%, #30283e 37%, #201b2c 72%);
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; min-height: 100dvh; padding: 20px 22px 30px; display: flex; flex-direction: column; align-items: center; }
    .topline { width: min(1140px, 100%); display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .brand-mini { display:flex; align-items:center; gap:9px; color:#f9e8d2; font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .brand-mini .mark { font-size:24px; filter:drop-shadow(0 3px 5px #0005); }
    .live-pill { display:flex; align-items:center; gap:8px; color:#c8f1de; background:#3aa17724; border:1px solid #67d9b051; padding:8px 12px; border-radius:99px; font-size:12px; font-weight:750; letter-spacing:.02em; }
    .live-dot { width:7px;height:7px;border-radius:50%;background:#73e0ae;box-shadow:0 0 0 4px #73e0ae20; }
    main { width:min(1080px, 100%); flex:1; display:flex; align-items:center; justify-content:center; }
    .view { width:100%; animation: arrive .35s ease both; }
    @keyframes arrive { from {opacity:0; transform:translateY(8px)} to {opacity:1; transform:translateY(0)} }
    .landing { display:grid; grid-template-columns: 1.08fr .92fr; gap:clamp(28px, 5vw, 72px); align-items:center; padding:22px 0 36px; }
    .hero { padding-left:clamp(0px, 3vw, 34px); }
    .eyebrow { display:inline-flex; gap:8px; align-items:center; border:1px solid #ffffff24; background:#ffffff0c; padding:8px 12px; border-radius:99px; color:#ffd794; text-transform:uppercase; font-size:11px; letter-spacing:.12em; font-weight:850; }
    h1 { font-size:clamp(58px, 8vw, 94px); line-height:.87; letter-spacing:-.075em; margin:20px 0 16px; max-width:600px; color:#fff2d8; text-shadow:0 7px 0 #382838; }
    h1 span { display:block; color:var(--orange); }
    .hero-copy { color:#c9bdd0; font-size:17px; line-height:1.6; max-width:430px; margin:0; }
    .food-stamp { display:flex; gap:8px; margin-top:24px; font-size:27px; }
    .food-stamp span { width:48px;height:48px;display:grid;place-items:center;background:#ffffff0d;border:1px solid #ffffff16;border-radius:15px;box-shadow:0 7px 16px #120e1c42; transform:rotate(var(--r)); }
    .food-stamp span:nth-child(2n) { --r:4deg; }.food-stamp span:nth-child(2n+1) { --r:-4deg; }
    .join-card { background:linear-gradient(145deg, #fff5e6 0%, #f8e6d0 100%); color:var(--ink); border-radius:26px; padding:27px; box-shadow:0 22px 55px #100c1b70, inset 0 1px #fff; max-width:430px; width:100%; justify-self:center; }
    .card-title { font-size:22px; font-weight:900; letter-spacing:-.04em; margin:0 0 5px; }
    .card-sub { margin:0 0 20px; color:#716677; font-size:13px; line-height:1.45; }
    label { display:block; font-size:11px; font-weight:850; text-transform:uppercase; letter-spacing:.1em; color:#746979; margin:0 0 7px; }
    .field { width:100%; border:1.5px solid #dfd2c6; background:#fffaf3; border-radius:12px; color:#32283b; padding:13px 14px; outline:none; transition:.18s; }
    .field:focus { border-color:#ee796a; box-shadow:0 0 0 3px #ee796a22; }
    .field::placeholder { color:#a89caa; }
    .field-group { margin:14px 0; }
    .room-entry { display:grid; grid-template-columns:1fr auto; gap:9px; align-items:end; }
    .room-code-input { text-transform:uppercase; letter-spacing:.18em; font-weight:850; }
    .button { border:0; border-radius:12px; padding:13px 16px; font-weight:900; letter-spacing:.01em; transition:transform .14s, filter .14s, box-shadow .14s; }
    .button:hover { transform:translateY(-2px); filter:brightness(1.04); }
    .button:active { transform:translateY(0) scale(.98); }
    .button-primary { width:100%; background:linear-gradient(135deg, #ff8a59, #ee637b); color:white; box-shadow:0 8px 16px #dc6c5b40, inset 0 1px #ffffff70; }
    .button-join { color:#35283a; background:#e9d8ca; padding:13px 19px; }
    .or { display:flex; align-items:center; gap:11px; color:#a0929f; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin:16px 0 12px; }
    .or:before,.or:after { content:""; height:1px; flex:1; background:#decec0; }
    .fineprint { display:flex; align-items:center; justify-content:center; gap:6px; margin:16px 0 0; font-size:11px; color:#91828f; }
    .error { color:#a73f52; font-size:12px; font-weight:750; min-height:17px; margin:9px 0 0; }
    .room-layout { display:grid; grid-template-columns: minmax(0, 1fr) 310px; gap:20px; align-items:stretch; }
    .room-main,.side-panel { border:1px solid #ffffff19; background:linear-gradient(145deg,#ffffff11,#ffffff07); border-radius:24px; box-shadow:0 17px 42px #120d1b38; }
    .room-main { padding:clamp(20px,4vw,38px); min-height:440px; display:flex; flex-direction:column; justify-content:center; }
    .section-tag { color:#ffc66a; font-size:11px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    .room-heading { font-size:clamp(34px,5vw,52px); letter-spacing:-.06em; margin:9px 0 3px; }
    .room-help { color:var(--muted); margin:0; }
    .code-box { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:22px 0 24px; }
    .code-display { display:inline-flex; gap:9px; padding:13px 17px; border-radius:15px; background:#171321; border:1px solid #ffffff20; color:#ffcf72; font-size:24px; font-weight:950; letter-spacing:.18em; box-shadow:inset 0 2px 8px #0005; }
    .copy-btn { border:1px solid #ffffff30; color:#eee4ef; background:#ffffff0b; border-radius:11px; padding:11px 13px; font-size:12px; font-weight:800; }
    .players-title { display:flex; justify-content:space-between; align-items:center; color:#d9cddd; font-size:12px; font-weight:850; text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
    .player-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .player-card { display:flex; align-items:center; gap:10px; border:1px solid #ffffff19; background:#ffffff09; border-radius:12px; padding:10px 12px; min-width:0; }
    .player-dot { width:12px;height:12px;flex:none;border-radius:50%;box-shadow:0 0 0 4px color-mix(in srgb, var(--player-color) 18%, transparent); background:var(--player-color); }
    .player-name { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:13px; }
    .host-mark { margin-left:auto;font-size:10px;color:#ffd27c;background:#ffd27c19;border-radius:99px;padding:4px 6px; }

    .side-illustration { text-align:center; font-size:54px; margin:3px 0 14px; filter:drop-shadow(0 7px 8px #0004); }
    .side-panel h3 { margin:0 0 7px; font-size:21px; letter-spacing:-.04em; }
    .side-panel p { margin:0; color:var(--muted); font-size:13px; line-height:1.55; }
    .rules-mini { display:grid; gap:8px; margin:17px 0; }

    .rule-mini strong { color:#ffd278; }
    .duration-poll { margin-top:16px; }
    .duration-poll-title { color:#ffd278;font-size:12px;font-weight:900;letter-spacing:.04em; }
    .duration-options { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px; }
    .duration-vote { min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 5px;border:1px solid #ffffff24;border-radius:11px;background:#ffffff09;color:#f5eafa; }
    .duration-vote.selected { border-color:#ffcf72a8;background:#ffcf7220;box-shadow:0 0 0 1px #ffcf7222; }
    .duration-vote strong { font-size:13px;white-space:nowrap; }
    .duration-vote span { color:#c9bdd0;font-size:9px;font-weight:750;white-space:nowrap; }
    .duration-poll-note { margin:7px 0 0 !important;font-size:10px !important;line-height:1.35 !important; }
    .start-btn { margin-top:12px; background:linear-gradient(135deg,#ffa23f,#f16d68); color:#2a1b28; box-shadow:0 8px 18px #ee775146; }
    .start-btn:disabled { opacity:.45; filter:saturate(.5); cursor:not-allowed; transform:none; }
    .game-wrap { width:100%; }
    .game-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 12px; flex-wrap:wrap; }
    .game-title-block { display:flex; align-items:center; gap:12px; }
    .game-actions { display:flex; align-items:center; gap:7px; }
    .game-title { margin:0; font-size:26px; letter-spacing:-.055em; }

    .fullscreen-btn { font-size:18px; line-height:1; padding:8px 10px; }
    .score-strip { display:flex; gap:7px; overflow:auto; padding:2px 2px 9px; scrollbar-width:thin; margin-bottom:2px; }
    .timer-chip { position:sticky;left:0;z-index:1;flex:none;display:flex;flex-direction:column;justify-content:center;min-width:98px;padding:6px 11px;border:1px solid #ffcf7260;border-radius:12px;background:#332b3d;box-shadow:5px 0 12px #201b2c66; }
    .timer-chip.sudden { border-color:#ff6e79b0;background:#512b42;animation:timer-pulse 1.1s ease-in-out infinite alternate; }
    .timer-chip.final { border-color:#ffffff30;background:#292432; }
    .timer-caption { color:#d2c5d7;font-size:8px;font-weight:950;letter-spacing:.12em;text-transform:uppercase; }
    .timer-value { color:#ffcf72;font-size:20px;line-height:1.15;font-weight:950;font-variant-numeric:tabular-nums; }
    .timer-chip.sudden .timer-caption,.timer-chip.sudden .timer-value { color:#ffb2b2; }
    @keyframes timer-pulse { to { box-shadow:0 0 0 3px #ff6e7920,5px 0 12px #201b2c66; } }
    .score-chip { flex:none; display:flex; align-items:center; gap:8px; background:#ffffff0e; border:1px solid #ffffff18; border-radius:12px; padding:8px 11px; min-width:104px; }
    .score-chip.me { background:#ffffff1b; border-color:#ffcf7280; box-shadow:0 0 0 1px #ffcf7220; }
    .score-dot { width:9px;height:9px;border-radius:50%;background:var(--player-color); }
    .score-name { max-width:69px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:800;color:#e8deeb; }
    .score-value { margin-left:auto; font-size:16px; font-weight:950; color:#ffcf72; }
    .game-shell { overflow:hidden; border-radius:20px; border:2px solid #f7d7ad; box-shadow:0 16px 40px #110c1c66, 0 0 0 5px #fff1; background:#345f4d; position:relative; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:10/7; touch-action:none; }
    .effect-banner { position:absolute; left:50%; top:12px; transform:translate(-50%,-7px); opacity:0; pointer-events:none; transition:.25s; color:#352037; background:#ffcf72; padding:8px 13px; border-radius:99px; font-size:11px; font-weight:950; letter-spacing:.08em; text-transform:uppercase; box-shadow:0 4px 15px #1e13254d; white-space:nowrap; }
    .effect-banner.on { opacity:1; transform:translate(-50%,0); }
    .round-countdown { position:absolute;inset:0;z-index:2;display:none;place-items:center;background:#17132199;pointer-events:none; }
    .round-countdown.show { display:grid; }
    .countdown-card { display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff2d8;text-align:center;text-shadow:0 5px 20px #0009; }
    .countdown-card span { font-size:clamp(12px,2vw,18px);font-weight:950;letter-spacing:.15em;text-transform:uppercase; }
    .countdown-card strong { color:#ffcf72;font-size:clamp(86px,20vw,180px);line-height:.9;font-weight:1000;letter-spacing:-.09em;animation:countdown-pop .55s ease both; }
    @keyframes countdown-pop { from { opacity:.25;transform:scale(1.5); } to { opacity:1;transform:scale(1); } }
    .game-bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px; color:#c7bbcb; font-size:12px; }
    .howto { display:flex; gap:9px; align-items:center; }
    .howto .hand { font-size:18px; }
    .held-status { color:#ffd27a; font-weight:800; text-align:right; }
    .game-over { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#171321b8; backdrop-filter:blur(5px); z-index:3; }
    .game-over.show { display:flex; }
    .winner-card { text-align:center; background:#fff1da; color:#2b2034; padding:24px 29px; border-radius:22px; width:min(340px,calc(100% - 30px)); box-shadow:0 20px 60px #0007; animation:arrive .4s ease both; }
    .winner-emoji { font-size:44px; }
    .winner-card h2 { font-size:30px; letter-spacing:-.06em; margin:5px 0; }
    .winner-card p { color:#746779; font-size:13px; margin:0 0 17px; }
    .winner-card .button { width:100%; background:#2e2538; color:#fff1da; }
    .selfie-backdrop { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:#100d19d9; backdrop-filter:blur(8px); }
    .selfie-card { position:relative; width:min(420px,100%); padding:25px; border-radius:24px; background:#fff2d8; color:var(--ink); box-shadow:0 24px 70px #0009; text-align:center; }
    .selfie-card h2 { margin:6px 0 8px; font-size:27px; letter-spacing:-.05em; }
    .selfie-copy { margin:0 auto 17px; max-width:340px; color:#716677; font-size:13px; line-height:1.5; }
    .selfie-frame { width:min(230px,65vw); aspect-ratio:1; margin:0 auto 12px; overflow:hidden; border:4px solid #fff; border-radius:24px; background:#332c3e; box-shadow:0 8px 22px #392a3330; }
    .selfie-frame video,.selfie-frame img { display:block; width:100%; height:100%; object-fit:cover; }
    .selfie-frame video { transform:scaleX(-1); }
    .selfie-frame [hidden],.selfie-actions [hidden] { display:none !important; }
    .selfie-status { min-height:18px; margin:0 0 12px; color:#6f6376; font-size:12px; font-weight:700; }
    .selfie-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; }
    .selfie-actions .button { padding:11px 14px; }
    .selfie-primary { background:linear-gradient(135deg,#ff8a59,#ee637b); color:#fff; }
    .selfie-secondary { background:#e8dacb; color:#35283a; }
    .selfie-cancel { margin-top:11px; border:0; background:transparent; color:#786b7a; font-weight:800; padding:8px 12px; }
    .sound-toggle { width:38px; height:36px; display:grid; place-items:center; padding:7px; font-size:17px; }
    .sound-toggle:disabled { opacity:.5; cursor:not-allowed; }
    .mobile-note { display:none; color:#c9bdd0; font-size:11px; margin:9px 2px 0; }
    .footer { width:min(1080px,100%); padding-top:16px; display:flex; justify-content:space-between; gap:12px; color:#94879c; font-size:10px; }
    .footer span:last-child { text-align:right; }
    @media (max-width:780px) {
      .app { padding:12px 13px 22px; }
      .topline { margin-bottom:3px; }
      .landing { grid-template-columns:1fr; gap:18px; padding:15px 0 25px; }
      .hero { text-align:center; padding:0; }
      h1 { font-size:clamp(54px,16vw,78px); margin:12px auto; }
      .hero-copy { margin:auto; font-size:14px; max-width:360px; }
      .food-stamp { justify-content:center; margin-top:13px; }
      .food-stamp span { width:39px;height:39px;font-size:22px; }
      .join-card { padding:20px; border-radius:21px; }
      .room-layout { grid-template-columns:1fr; }
      .room-main { min-height:auto; padding:23px 19px; }
      .side-panel { padding:18px; }
      .side-illustration { display:none; }
      .side-panel .rules-mini { grid-template-columns:repeat(2,1fr); }
      .game-title { font-size:21px; }
      .game-top { align-items:flex-start; }
      .game-bottom { align-items:flex-start; font-size:11px; }
      .mobile-note { display:block; }
    }
    @media (max-width:780px) {
      body.game-active { height:100vh; height:100dvh; min-height:0; overflow:hidden; }
      body.game-active .app {
        width:100%; height:100vh; height:100dvh; min-height:0;
        padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      body.game-active .topline, body.game-active .footer { display:none; }
      body.game-active main { width:100%; flex:1; min-height:0; }
      body.game-active .game-wrap { height:100%; min-height:0; display:flex; flex-direction:column; gap:8px; }
      body.game-active .game-top { flex:none; flex-wrap:nowrap; align-items:center; gap:7px; margin:0; }
      body.game-active .game-title-block { min-width:0; gap:7px; }
      body.game-active .game-title { font-size:20px; white-space:nowrap; }
      body.game-active .code-chip { font-size:9px; letter-spacing:.08em; padding:6px 7px; white-space:nowrap; }
      body.game-active .game-actions .copy-btn { flex:none; padding:7px 9px; white-space:nowrap; }
      body.game-active .score-strip { flex:none; margin:0; padding:0 2px 3px; }
      body.game-active .game-shell { flex:1; min-height:0; width:100%; display:grid; place-items:center; border-radius:12px; }
      body.game-active canvas { width:100%; height:100%; aspect-ratio:auto; }
      body.game-active .game-bottom { flex:none; margin:0; padding:0 2px; align-items:center; }
      body.game-active .howto { max-width:70%; }
      body.game-active .mobile-note { flex:none; margin:0 2px; font-size:10px; }

      body.game-active .game-title { font-size:17px; }
      body.game-active .code-chip { font-size:8px; letter-spacing:.04em; padding:5px 6px; }
      body.game-active .game-actions { gap:4px; }
      body.game-active .game-actions .copy-btn { padding:6px; }
      body.game-active .game-actions .sound-toggle,body.game-active .fullscreen-btn { width:32px; height:32px; }

<body>
  <div class="app">
    <header class="topline">
      <div class="brand-mini"><span class="mark">🍔</span> Late night games</div>
      <div class="live-pill"><span class="live-dot"></span> REAL-TIME MAYHEM</div>
    </header>
    <main id="main"></main>
    <footer class="footer"><span>Made for friendly chaos · 2–8 players</span><span>Best served with friends and questionable aim.</span></footer>
  </div>
  <script>
  (() => {
    const main = document.getElementById('main');
    const socketUrl = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`;
    let ws, playerId = null, sessionKey = null, roomCode = null, isHost = false, room = null, view = 'home', playerName = '', toastTimer, gesture = null, reconnectTimer = null, reconnectAttempts = 0, reconnecting = false, pendingJoin = null, joinAttemptTimer = null, cameraStream = null, capturedSelfie = null, audioContext = null, masterGain = null, audioMuted = false, musicTimer = null, musicStep = 0, lastSlideSound = 0;
    const avatarImages = new Map();
    const heardScoreEvents = new Set();
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve();
      return new Promise((resolve, reject) => {
        ws = new WebSocket(socketUrl);
        ws.onopen = () => { reconnectAttempts = 0; resolve(); };
        ws.onerror = () => reject(new Error('Can’t reach the kitchen right now.'));
        ws.onmessage = ev => { try { handle(JSON.parse(ev.data)); } catch {} };
        ws.onclose = () => {
          if (sessionKey && roomCode) scheduleReconnect();
          else if (view !== 'home') showToast('Kitchen connection lost. Return to the lobby to rejoin.');
        };
      });
    }
    function scheduleReconnect() {
      if (reconnectTimer || !sessionKey || !roomCode) return;
      reconnecting = true;
      const delay = Math.min(15000, 800 * (2 ** reconnectAttempts++));
      if (reconnectAttempts === 1) showToast('Connection dipped. Rejoining the kitchen…');
      reconnectTimer = setTimeout(async () => {
        reconnectTimer = null;
        try { await connect(); send({type:'resume',code:roomCode,sessionKey}); }
        catch { scheduleReconnect(); }
      }, delay);
    }
    function send(packet) {
      if (ws?.readyState !== WebSocket.OPEN) return false;
      ws.send(JSON.stringify(packet)); return true;
    }
    function handle(data) {
      if (data.type === 'welcome') {
        playerId = data.playerId; sessionKey = data.sessionKey; roomCode = data.code; isHost = data.host;
        reconnecting = false; reconnectAttempts = 0; clearTimeout(reconnectTimer); reconnectTimer = null;
        if (pendingJoin?.sent && ['create','join'].includes(pendingJoin.type)) closeSelfieStep();
      }
      else if (data.type === 'error') {
        if (pendingJoin?.submitting || pendingJoin?.sent) showRoomEntryFailure(data.message);
        else if (reconnecting) {

          <div class="game-top"><div class="game-title-block"><h1 class="game-title">Panic Pantry</h1><span class="code-chip">TO 100 · ${esc(room.code)}</span></div><div class="game-actions"><button class="copy-btn sound-toggle" data-sound-toggle type="button" aria-label="Mute sounds" title="Mute sounds">🔊</button><button id="fullscreen-game" class="copy-btn fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button><button id="leave-game" class="copy-btn">Leave</button></div></div>
          <div class="score-strip" id="score-strip"></div>
          <div class="game-shell"><canvas id="game-canvas" width="1000" height="700" aria-label="Shared diner game table"></canvas><div class="effect-banner" id="effect-banner"></div><div class="round-countdown" id="round-countdown"></div><div class="game-over" id="game-over"></div></div>
          <div class="game-bottom"><div class="howto"><span class="hand">👆</span><span>Tap food to catch · swipe toward a tray to toss</span></div><span class="held-status" id="held-status"></span></div>
          <p class="mobile-note">First to 100 wins. At time, high score wins; tied scores go sudden death. In sudden death: +food in your tray or −food in a rival’s tray wins.</p>
        </section>`;
        canvas = document.getElementById('game-canvas'); ctx = canvas.getContext('2d');
        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointercancel', onPointerUp);
        const fullscreenButton = document.getElementById('fullscreen-game');
        if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen) fullscreenButton.hidden = true;
        else fullscreenButton.onclick = toggleFullscreen;
        document.getElementById('leave-game').onclick = goHome;
        cancelAnimationFrame(gameFrame); animate();
        bindSoundButtons();
      }
      updateGameUI();
    }
    function updateGameUI() {
      if (!room || view !== 'game') return;
      const strip = document.getElementById('score-strip');
      if (strip) {
        const starting = room.status === 'countdown';
        const seconds = starting ? Math.max(1, Math.ceil(Math.max(0, room.countdownRemainingMs || 0) / 1000)) : Math.ceil(Math.max(0, room.timeRemainingMs ?? 180000) / 1000);
        const timer = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
        const timerState = room.suddenDeath ? 'sudden' : room.status === 'over' ? 'final' : '';
        const timerCaption = starting ? 'Starting in' : room.suddenDeath ? 'Sudden death' : room.status === 'over' ? 'Round over' : 'Time left';
        strip.innerHTML = `<div class="timer-chip ${timerState}"><span class="timer-caption">${timerCaption}</span><strong class="timer-value">${timer}</strong></div>` + room.players.map(p => `<div class="score-chip ${p.id === playerId ? 'me' : ''}" style="--player-color:${p.color}"><span class="score-dot"></span><span class="score-name">${esc(p.name)}${p.id === playerId ? ' · YOU' : ''}</span><strong class="score-value">${p.score}</strong></div>`).join('');
      }
      const countdown = document.getElementById('round-countdown');
      if (countdown) {
        const active = room.status === 'countdown';
        countdown.classList.toggle('show', active);
        const value = String(Math.max(1, Math.ceil(Math.max(0, room.countdownRemainingMs || 0) / 1000)));
        if (active && countdown.dataset.value !== value) {
          countdown.dataset.value = value;
          countdown.innerHTML = `<div class="countdown-card"><span>Round starts in</span><strong>${value}</strong></div>`;
        }
      }
      const held = room.objects.find(o => o.heldBy === playerId);
      const status = document.getElementById('held-status');
      if (status) status.textContent = gesture ? 'Flick to toss!' : held ? `Holding ${held.label} · aim for a tray` : 'Catch a snack!';
      const banner = document.getElementById('effect-banner');
      if (banner) {
        const label = room.suddenDeath ? 'SUDDEN DEATH · FIRST DECISIVE TRAY HIT WINS' : room.kitty ? 'KITTY ON THE LOOSE!' : room.effect?.kind !== 'calm' ? room.effect?.label : '';
        banner.textContent = label || '';
        banner.classList.toggle('on', Boolean(label));
      }
      const over = document.getElementById('game-over');
      if (over) {
        over.classList.toggle('show', room.status === 'over');
        if (room.status === 'over') {
          const winners = (room.winners || []).map(id => room.players.find(p => p.id === id)).filter(Boolean);
          const winner = winners[0];
          const tied = winners.length > 1;
          const title = tied ? 'A perfect tie!' : winner?.id === playerId ? 'You got the spatula!' : `${esc(winner?.name || 'A diner')} wins!`;
          const detail = tied ? `${winners.map(p => esc(p.name)).join(' and ')} hit 100 together.` : room.finishReason === 'time' ? `${esc(winner?.name || 'A diner')} led with ${winner?.score ?? 0} points when time ran out.` : room.finishReason === 'sudden-death' ? `${esc(winner?.name || 'A diner')} won the tiebreaker with the first decisive tray hit.` : `${esc(winner?.name || 'A diner')} served up 100 points first.`;
          over.innerHTML = `<div class="winner-card"><div class="winner-emoji">${tied ? '🤝' : '🏆'}</div><h2>${title}</h2><p>${detail}</p>${isHost ? '<button class="button" id="play-again">Another round!</button>' : '<button class="button" id="back-lobby">Back to the room</button>'}</div>`;
          document.getElementById('play-again')?.addEventListener('click', () => send({type:'start'}));
          document.getElementById('back-lobby')?.addEventListener('click', () => { showToast('Ask the host to start another round.'); });
        }
      }
    }
    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return { x:(e.clientX-rect.left)*1000/rect.width, y:(e.clientY-rect.top)*700/rect.height };
    }
    function screenDistance(a,b) {
      const rect=canvas.getBoundingClientRect();
      return Math.hypot((a.x-b.x)*rect.width/1000,(a.y-b.y)*rect.height/700);
    }
    function screenScaleY() { return canvas.getBoundingClientRect().height/700; }
    function canvasXCompensation() {
      const rect=canvas.getBoundingClientRect();
      return rect.width ? (rect.height/700)/(rect.width/1000) : 1;
    }
    function onPointerDown(e) {
      if (!room || room.status !== 'playing') return;
      activateAudio();
      const p = canvasPoint(e); canvas.setPointerCapture(e.pointerId);
      const held = room.objects.find(o => o.heldBy === playerId);
      if (held) {
        if (screenDistance(p,held) >= 74*screenScaleY()) return;
        gesture = { start:{x:held.x,y:held.y}, end:p, pointerId:e.pointerId };
        updateGameUI(); return;
      }
      const target = room.objects.filter(o => !o.heldBy && !o.thrown).sort((a,b) => screenDistance(a,p)-screenDistance(b,p))[0];
      if (target && screenDistance(target,p) < Math.max(46,target.radius+18)*screenScaleY()) send({type:'catch',id:target.id});
    }
    function onPointerMove(e) { if (gesture && gesture.pointerId === e.pointerId) { gesture.end = canvasPoint(e); playSlideSound(); } }
    function onPointerUp(e) {
      if (!gesture || gesture.pointerId !== e.pointerId) return;
      gesture.end = canvasPoint(e);
      const dx = gesture.end.x-gesture.start.x, dy=gesture.end.y-gesture.start.y, length=Math.hypot(dx,dy);
      gesture = null; updateGameUI();
      if (length > 15) send({type:'toss',dx,dy,power:Math.min(1,length/170)});
    }
    function canvasText(text,x,y) {
      ctx.save();ctx.translate(x,y);ctx.scale(canvasXCompensation(),1);ctx.fillText(text,0,0);ctx.restore();
    }
    function rounded(x,y,w,h,r,fill,stroke) {
      ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
      if (fill) { ctx.fillStyle=fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle=stroke; ctx.stroke(); }
    }
    function drawTable() {
      const g=ctx.createLinearGradient(0,0,1000,700); g.addColorStop(0,'#4f8565');g.addColorStop(1,'#315c4d');
      ctx.fillStyle=g;ctx.fillRect(0,0,1000,700);
      ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#d8efc1';ctx.lineWidth=1;
      for(let i=0;i<18;i++){ctx.beginPath();ctx.moveTo(i*73-30,0);ctx.lineTo(i*73+120,700);ctx.stroke();}
      ctx.restore();
      ctx.save();ctx.strokeStyle='#e4d7aa55';ctx.setLineDash([9,13]);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(500,330,300,210,0,0,Math.PI*2);ctx.stroke();ctx.restore();
      ctx.fillStyle='#fff2d844';ctx.font='900 15px system-ui';ctx.textAlign='center';canvasText('THE FLYING FOOD ZONE',500,42);
    }
    function getAvatarImage(player) {
      if (!player.avatarUrl) return null;
      let image=avatarImages.get(player.avatarUrl);
      if (!image) { image=new Image();image.src=player.avatarUrl;avatarImages.set(player.avatarUrl,image); }
      return image.complete && image.naturalWidth ? image : null;
    }
    function drawAvatar(player,x,y,size) {
      const image=getAvatarImage(player), radius=size/2;
      ctx.save();ctx.translate(x,y);ctx.scale(canvasXCompensation(),1);
      ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.clip();
      if (image) ctx.drawImage(image,-radius,-radius,size,size);
      else {
        ctx.fillStyle=player.color;ctx.fillRect(-radius,-radius,size,size);
        ctx.fillStyle='#fff8e8';ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((player.name||'?').slice(0,1).toUpperCase(),0,1);
      }
      ctx.restore();
      ctx.save();ctx.translate(x,y);ctx.scale(canvasXCompensation(),1);ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.lineWidth=2;ctx.strokeStyle='#fff8e8';ctx.stroke();ctx.restore();
    }
    function drawTray(tray) {
      const player=room.players.find(p=>p.id===tray.id); if(!player)return;
      const w=Math.min(115,1000/(room.players.length+0.5)), x=tray.x-w/2, y=tray.y-43;
      ctx.save();ctx.shadowColor='#14252088';ctx.shadowBlur=12;ctx.shadowOffsetY=6;
      rounded(x,y,w,60,14,'#e8bf87','#fff3d4');ctx.restore();
      rounded(x+5,y+5,w-10,49,10,'#ffffff1a',null);
      drawAvatar(player,tray.x,y+17,28);
      ctx.fillStyle='#2e2931';ctx.font='900 10px system-ui';ctx.textAlign='center';canvasText(player.name.length>12?player.name.slice(0,11)+'…':player.name,tray.x,y+43);
      ctx.fillStyle='#59443d';ctx.font='800 8px system-ui';canvasText(player.id===playerId?'YOUR TRAY':'TRAY',tray.x,y+55);
    }
    function drawFood(obj) {
      ctx.save();
      const held=obj.heldBy===playerId;
      ctx.translate(obj.x,obj.y);ctx.rotate(Math.sin(obj.wobble)*.12);
      ctx.scale(canvasXCompensation(),1);
      ctx.shadowColor=held?'#fff4b9':'#17251f77';ctx.shadowBlur=held?22:9;ctx.shadowOffsetY=4;
      ctx.beginPath();ctx.ellipse(0,0,obj.radius+3,obj.radius*.78+3,0,0,Math.PI*2);
      ctx.fillStyle=held?'#fff1b5':'#f6eadb';ctx.fill();
      ctx.shadowColor='transparent';ctx.font=obj.kind==='burnt'?'26px system-ui':'31px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(obj.emoji,0,1);
      rounded(-19,17,38,16,7,obj.points < 0 ? '#9b4d50' : '#276b53',null);
      ctx.fillStyle='#fff6db';ctx.font='900 10px system-ui';ctx.textBaseline='middle';ctx.fillText(`${obj.points > 0 ? '+' : ''}${obj.points}`,0,25);
      if (held) { ctx.strokeStyle='#fff6ad';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,obj.radius+9,0,Math.PI*2);ctx.stroke(); }
      if (obj.thrownBy===playerId) { ctx.fillStyle='#fff4d9';ctx.font='900 10px system-ui';ctx.fillText('✦',obj.radius+7,-obj.radius); }
      ctx.restore();
    }
    function drawKitty() {
      if (!room.kitty) return;
      const cat=room.kitty;
      ctx.save();ctx.translate(cat.x,cat.y);ctx.scale(cat.direction,1);
      ctx.font='52px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#17112388';ctx.shadowBlur=12;canvasText('🐈',0,0);
      ctx.restore();
    }
    function drawGesture() {
      if (!gesture) return;
      const held=room.objects.find(o=>o.heldBy===playerId); if(!held)return;
      ctx.save();ctx.strokeStyle='#fff1a5';ctx.lineWidth=5;ctx.lineCap='round';ctx.setLineDash([8,7]);
      ctx.beginPath();ctx.moveTo(held.x,held.y);ctx.lineTo(gesture.end.x,gesture.end.y);ctx.stroke();
      const a=Math.atan2(gesture.end.y-held.y,gesture.end.x-held.x);ctx.setLineDash([]);ctx.fillStyle='#fff1a5';ctx.beginPath();ctx.moveTo(gesture.end.x,gesture.end.y);ctx.lineTo(gesture.end.x-16*Math.cos(a-.5),gesture.end.y-16*Math.sin(a-.5));ctx.lineTo(gesture.end.x-16*Math.cos(a+.5),gesture.end.y-16*Math.sin(a+.5));ctx.closePath();ctx.fill();ctx.restore();
    }
    function draw() {
      if (!canvas || !room) return;
      ctx.clearRect(0,0,1000,700);drawTable();
      room.trays?.forEach(drawTray);
      room.objects?.forEach(drawFood);drawKitty();drawGesture();
      if (room.status==='playing' && !room.objects.some(o=>o.heldBy===playerId)) {
        ctx.save();ctx.fillStyle='#fff6d99b';ctx.font='800 12px system-ui';ctx.textAlign='center';canvasText('TAP A SNACK TO CATCH IT',500,680);ctx.restore();
      }
    }
    function animate() { if(view!=='game')return;draw();gameFrame=requestAnimationFrame(animate); }
    renderHome();
  })();
  </script>
</body>
</html>
